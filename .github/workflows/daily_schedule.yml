name: Investment Agent Daily

on:
  schedule:
    # 16:30 PST (UTC-8) = 00:30 UTC next day
    # Everyday PST -> Everyday UTC
    - cron: "30 0 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  daily-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Daily Watchdog
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          python src/core/main.py --mode daily

      - name: Commit Updated State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/user_state.json
          git diff --staged --quiet || git commit -m "chore: auto-update user_state.json [skip ci]"
          git pull --rebase
          git push
