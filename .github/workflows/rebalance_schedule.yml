name: Investment Agent Rebalance

on:
  schedule:
    # 16:35 PST Friday = 00:35 UTC Saturday
    - cron: "35 0 * * 6"
  workflow_dispatch:

jobs:
  rebalance-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Rebalance Notification (Bi-Weekly)
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587
          # Note: We need other keys just in case config imports them,
          # though send_notification doesn't strictly need Alpaca to send email.
          # But config.py validates them! So we MUST provide them.
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Check if Week Number is EVEN (approx bi-weekly)
          WEEK_NUM=$(date +%V)
          if [ $(( 10#$WEEK_NUM % 2 )) -eq 0 ]; then
            echo "Even week ($WEEK_NUM). Running automated rebalance..."
            export PYTHONPATH=$PYTHONPATH:.
            python src/core/main.py --mode rebalance --auto
          else
            echo "Odd week ($WEEK_NUM). Skipping."
          fi

      - name: Commit Updated State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/user_state.json
          git diff --staged --quiet || git commit -m "chore: auto-update user_state.json [skip ci]"
          git pull --rebase
          git push
